[package]
name = "structdiff"
version = "0.1.0"
edition = "2021"
description = "Semantic JSON diff — reports added/removed/changed by path (user.address.city), not a line-based text diff that chokes on reordered keys"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/structdiff"
readme = "README.md"
keywords = ["json", "diff", "cli", "semantic-diff"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "structdiff"
path = "src/lib.rs"

[[bin]]
name = "structdiff"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
